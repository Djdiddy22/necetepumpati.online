<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SRBIJA POBEĐUJE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --white:#ffffff;
  }
 
  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }
 
  html,body{
    width:100%;
    height:100%;
    background:var(--white);
    color:var(--black);
    overflow:hidden;
  }
 
  body{
    font-family:"IBM Plex Mono", monospace;
    -webkit-font-smoothing:antialiased;
  }
 
  /* entry fade */
  body{
    opacity:0;
    animation:enter 1.4s ease forwards;
  }
  @keyframes enter{
    to{opacity:1;}
  }
 
  .page{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:8vw;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 0.7s ease;
  }
  .page.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
 
  /* ---- HOME ---- */
  .headline{
    text-align:center;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:-0.01em;
    line-height:1.08;
    font-size:clamp(2rem, 6.2vw, 5rem);
    max-width:16ch;
  }
 
  /* ---- shared rounded text buttons ---- */
  .btn{
    background:transparent;
    color:var(--black);
    border:1px solid var(--black);
    border-radius:999px;
    font-family:"IBM Plex Mono", monospace;
    font-weight:400;
    font-size:0.85rem;
    padding:0.85em 2em;
    cursor:pointer;
    transition:background 0.25s ease, opacity 0.25s ease;
  }
  .btn:hover{
    background:rgba(10,10,10,0.06);
  }
 
  .contact-btn{
    margin-top:6vh;
  }
 
  /* ---- CONTACT ---- */
  .back-btn{
    position:absolute;
    top:6vh;
    left:6vw;
    background:none;
    border:none;
    font-size:1.4rem;
    line-height:1;
    cursor:pointer;
    color:#9a9a9a;
    padding:0.3em;
    font-family:"IBM Plex Mono", monospace;
    z-index:5;
  }
 
  .contact-wrap{
    width:100%;
    max-width:420px;
  }
 
  .contact-title{
    font-weight:400;
    font-size:clamp(1.3rem, 3.4vw, 1.8rem);
    text-align:center;
    margin-bottom:6vh;
  }
 
  form{
    display:flex;
    flex-direction:column;
    gap:2.4em;
  }
 
  .field{
    position:relative;
  }
 
  .field input{
    width:100%;
    border:none;
    background:transparent;
    font-family:"IBM Plex Mono", monospace;
    font-weight:400;
    font-size:0.95rem;
    padding:0.6em 0.1em;
    color:var(--black);
    outline:none;
  }
 
  .field input::placeholder{
    color:#9a9a9a;
    font-weight:400;
    font-size:0.85rem;
  }
 
  .send-btn{
    margin-top:2vh;
    align-self:center;
  }
 
  .confirm{
    text-align:center;
    font-weight:400;
    font-size:0.85rem;
    margin-top:1.6em;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .confirm.show{
    opacity:1;
  }
 
  footer{
    position:fixed;
    bottom:4vh;
    left:0;
    width:100%;
    text-align:center;
    font-size:0.75rem;
    font-weight:400;
    color:#9a9a9a;
    z-index:2;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:opacity 0.45s ease, visibility 0.45s ease;
  }
  footer.footer-hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
 
  .sub-link{
    cursor:pointer;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .sub-link:hover{
    color:#6a6a6a;
    border-bottom-color:#9a9a9a;
  }
 
  @media (max-width:480px){
    .headline{
      max-width:14ch;
    }
    form{
      gap:2em;
    }
  }
 
  /* ================= FOLDER (blank desktop) PAGE — real Windows 7 wallpaper ================= */
  #folder{
    background-image:url('wallpaper.jpg');
    background-size:cover;
    background-position:center;
    -webkit-user-select:none;
    user-select:none;
  }
 
  .desktop-icon{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:4px;
    cursor:default;
    /* fixed one-time-chosen spot, off-center — same on every load/refresh,
       not re-randomized (kept clear of the back button and bottom hint) */
    position:absolute;
    left:64%;
    top:29%;
    transform:translate(-50%,-50%);
  }
  .desktop-icon img{
    width:72px;
    height:72px;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .desktop-icon .icon-label{
    font-family:"IBM Plex Mono", monospace;
    font-size:0.8rem;
    color:var(--black);
    padding:1px 6px;
    border-radius:2px;
  }
  .desktop-icon.selected .icon-label{
    background:#2563eb;
    color:#fff;
  }
  .desktop-icon.selected img{
    filter:brightness(0.85) saturate(1.3);
  }
 
  .folder-hint{
    position:absolute;
    bottom:6vh;
    left:0;
    width:100%;
    text-align:center;
    font-size:0.7rem;
    color:#c2c2c2;
  }
 
  /* ================= EXPLORER WINDOW — uses the real insidefolder.jpg chrome image ================= */
  #library{
    background:#3a6ea5;
    background:linear-gradient(160deg,#5b8dc9,#2e5f96 60%,#1f4a7a);
  }
 
  .explorer-win{
    position:relative;
    width:min(1500px, 92vw);
    line-height:0;
    box-shadow:0 18px 45px rgba(0,0,0,0.45);
    -webkit-user-select:none;
    user-select:none;
  }
 
  .explorer-chrome{
    width:100%;
    height:auto;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    -webkit-user-select:none;
    user-select:none;
  }
 
  .explorer-close-zone{
    position:absolute;
    left:95.87%;
    top:0.89%;
    width:3.93%;
    height:3.55%;
    cursor:pointer;
  }
  .explorer-back-zone{
    position:absolute;
    left:0.4%;
    top:4.4%;
    width:3.4%;
    height:5.3%;
    cursor:pointer;
  }
 
  /* video icons dropped onto the white free space, sized/positioned in JS via percentages */
  .explorer-icon{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.4%;
    padding:4px 4px;
    border-radius:3px;
    cursor:default;
    text-align:center;
  }
  .explorer-icon .thumb-wrap{
    width:100%;
    aspect-ratio:16/9;
    border:2px solid #7a7a7a;
    border-radius:2px;
    overflow:hidden;
    background:#000;
    box-shadow:1px 1px 3px rgba(0,0,0,0.3);
  }
  .explorer-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    pointer-events:none;
  }
  .explorer-icon .vid-label{
    font-family:"Segoe UI",Tahoma,sans-serif;
    font-size:0.68rem;
    line-height:1.25;
    color:#000;
    padding:1px 5px;
    border-radius:2px;
    word-break:break-word;
  }
  .explorer-icon.selected .vid-label{
    background:#2563eb;
    color:#fff;
  }
  .explorer-icon.selected .thumb-wrap{
    outline:1px dashed #2563eb;
  }

  @media (max-width:700px){
    .explorer-icon .vid-label{
      font-size:0.85rem;
    }
  }
 
  /* ================= VIDEO PLAYER WINDOW (uses the real player.png chrome image) ================= */
  #player-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.25s ease;
  }
  #player-overlay.active{
    opacity:1;
    visibility:visible;
  }
 
  .player-win{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(640px, 92vw);
    pointer-events:auto;
    filter:drop-shadow(0 18px 40px rgba(0,0,0,0.45));
  }
 
  .player-frame{
    position:relative;
    width:100%;
    line-height:0;
  }
 
  .player-chrome{
    width:100%;
    height:auto;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    -webkit-user-select:none;
    user-select:none;
  }
 
  .player-video{
    position:absolute;
    left:2.8125%;
    top:13.8776%;
    width:93.594%;
    height:70.6122%;
    object-fit:cover;
    background:#000;
    display:block;
  }
 
  .player-drag-handle{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:13.8776%;
    cursor:grab;
    z-index:2;
  }
  .player-drag-handle:active{
    cursor:grabbing;
  }
 
  .player-close-zone{
    position:absolute;
    left:90.3%;
    top:3.06%;
    width:5.4%;
    height:6.2%;
    cursor:pointer;
    z-index:3;
  }
</style>
</head>
<body>
 
  <div id="home" class="page active">
    <h1 class="headline">NEĆETE PUMPATI!<br>SRBIJA POBEĐUJE 🇷🇸🇷🇸🇷🇸</h1>
    <button class="btn contact-btn" id="toContact">KONTAKTIRAJTE ME</button>
  </div>
 
  <div id="contact" class="page">
    <button class="back-btn" id="toHome" aria-label="">←</button>
    <div class="contact-wrap">
      <form id="contactForm">
        <div class="field">
          <input type="text" name="firstName" placeholder="Ime" required>
        </div>
        <div class="field">
          <input type="text" name="lastName" placeholder="Prezime" required>
        </div>
        <div class="field">
          <input type="email" name="email" placeholder="Email adresa" required>
        </div>
        <button type="submit" class="btn send-btn">POŠALJI</button>
        <p class="confirm" id="confirmMsg">Poruka poslata</p>
      </form>
    </div>
  </div>
 
  <!-- ================= blank desktop page with the folder icon ================= -->
  <div id="folder" class="page">
    <button class="back-btn" id="folderBack" aria-label="">←</button>
    <div class="desktop-icon" id="theFolder">
      <img src="Folder.png" alt="folder" draggable="false">
      <div class="icon-label">...</div>
    </div>
  </div>
 
  <!-- ================= video library — the real insidefolder.jpg screenshot, video icon dropped on the white space ================= -->
  <div id="library" class="page">
    <div class="explorer-win" id="explorerWin">
      <img src="insidefolder.jpg" class="explorer-chrome" alt="" draggable="false">
      <div class="explorer-close-zone" id="libraryClose" title=""></div>
      <div class="explorer-back-zone" id="libraryBack" title=""></div>
      <div id="videoGrid"></div>
    </div>
  </div>
 
  <!-- ================= video player "window" — uses the real player.png chrome, video sits in the black area, draggable ================= -->
  <div id="player-overlay">
    <div class="player-win" id="playerWin">
      <div class="player-frame">
        <img src="player.png" class="player-chrome" alt="" draggable="false">
        <video id="playerVideo" class="player-video" controls></video>
        <div class="player-drag-handle" id="playerTitlebar"></div>
        <div class="player-close-zone" id="playerClose" title="Zatvori"></div>
      </div>
    </div>
  </div>
 
 
  <footer id="siteFooter">Napravljen uz ❤️ iz <span class="sub-link" id="subLink">Subotice</span></footer>
 
  <audio id="anthem" src="anthem.mp3" loop preload="auto"></audio>
 
  <script>
    var home = document.getElementById('home');
    var contact = document.getElementById('contact');
    var folder = document.getElementById('folder');
    var library = document.getElementById('library');
    var footer = document.getElementById('siteFooter');
 
    var toContact = document.getElementById('toContact');
    var toHome = document.getElementById('toHome');
    var subLink = document.getElementById('subLink');
    var folderBack = document.getElementById('folderBack');
    var theFolder = document.getElementById('theFolder');
    var libraryClose = document.getElementById('libraryClose');
 
    var form = document.getElementById('contactForm');
    var confirmMsg = document.getElementById('confirmMsg');
    var anthem = document.getElementById('anthem');
 
    /* anthem: autoplay on load, loop forever, keeps playing through every
       page/section change — only openPlayer()/closePlayer() are allowed to
       pause/resume it (while a video is open).
       anthemAllowed goes false the moment "Subotice" is clicked, so the anthem
       stays stopped through folder/library/player, and only flips back true
       (resuming playback) once the user comes back to the homepage. */
    var anthemAllowed = true;
    function startAnthem(){
      if(!anthemAllowed) return;
      if(anthem.paused){
        anthem.play().catch(function(){
          /* autoplay blocked until a real user gesture happens */
        });
      }
    }
    function stopAnthem(){
      anthemAllowed = false;
      anthem.pause();
    }
    window.addEventListener('load', startAnthem);
    ['click','touchstart','keydown'].forEach(function(evt){
      document.addEventListener(evt, startAnthem);
    });
 
    function switchPage(fromEl, toEl){
      fromEl.classList.remove('active');
      if(toEl === home){
        footer.classList.remove('footer-hidden');
      } else {
        footer.classList.add('footer-hidden');
      }
      setTimeout(function(){
        toEl.classList.add('active');
      }, 700);
      /* make sure navigating never interrupts the anthem */
      startAnthem();
    }
 
    toContact.addEventListener('click', function(){
      switchPage(home, contact);
    });
 
    toHome.addEventListener('click', function(){
      switchPage(contact, home);
    });
 
    /* footer "Subotice" -> removes everything (footer fades too), stops the
       anthem, and opens blank desktop page */
    subLink.addEventListener('click', function(e){
      e.stopPropagation();
      stopAnthem();
      switchPage(home, folder);
    });
 
    folderBack.addEventListener('click', function(){
      theFolder.classList.remove('selected');
      anthemAllowed = true;
      switchPage(folder, home);
    });
 
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var data = new FormData(form);
      var first = data.get('firstName');
      var last = data.get('lastName');
      var email = data.get('email');
 
      var subject = encodeURIComponent('Poruka od ' + first + ' ' + last);
      var body = encodeURIComponent('Ime: ' + first + ' ' + last + '\nEmail: ' + email);
      window.location.href = 'mailto:lebromoficial@gmail.com?subject=' + subject + '&body=' + body;
 
      confirmMsg.classList.add('show');
    });
 
 
    /* ============== FOLDER ICON: single click select, double click open ============== */
    theFolder.addEventListener('click', function(e){
      e.stopPropagation();
      theFolder.classList.add('selected');
    });
    folder.addEventListener('click', function(){
      theFolder.classList.remove('selected');
    });
    theFolder.addEventListener('dblclick', function(e){
      e.stopPropagation();
      switchPage(folder, library);
    });
 
    libraryClose.addEventListener('click', function(){
      switchPage(library, folder);
    });
    document.getElementById('libraryBack').addEventListener('click', function(){
      switchPage(library, folder);
    });
 
    /* ============== VIDEO LIBRARY: add new videos here as you get more ============== */
    var videos = [
      {
        file: 'qTBT4U-ojSM_3mim.mp4',

    /* icon-grid coordinates, measured directly off the insidefolder.jpg pixels (1500x902)
       so the icons land on the real white free space of the window, like a real
       Windows large-icons view would lay them out.
       On phones the whole chrome image is squeezed down to ~90vw, which used to shrink
       the icon/thumbnail/label along with it (down to ~20px) and made the label text
       wrap one letter per line. getIconMetrics() detects narrow viewports and instead
       sizes the icon as a fixed, readable pixel footprint against the window's actual
       rendered width — desktop is untouched. */
    var explorerWin = document.getElementById('explorerWin');

    function isPhoneViewport(){
      return window.innerWidth <= 700;
    }

    function getIconMetrics(){
      var containerWidth = explorerWin.getBoundingClientRect().width || (window.innerWidth * 0.92);
      var containerHeight = containerWidth * (902 / 1500);
      var startXPct = 276 / 1500 * 100;
      var startYPct = 162 / 902 * 100;
      var paneRightPct = 1489 / 1500 * 100;

      if(isPhoneViewport()){
        var iconPx = 108;
        var cellPx = 134;
        return {
          startXPct: startXPct,
          startYPct: startYPct,
          cellWPct: cellPx / containerWidth * 100,
          cellHPct: cellPx / containerHeight * 100,
          iconWPct: iconPx / containerWidth * 100,
          paneRightPct: paneRightPct
        };
      }

      return {
        startXPct: startXPct,
        startYPct: startYPct,
        cellWPct: 118 / 1500 * 100,
        cellHPct: 118 / 902 * 100,
        iconWPct: 88 / 1500 * 100,
        paneRightPct: paneRightPct
      };
    }

    function renderVideos(){
      var m = getIconMetrics();
      var cols = Math.max(1, Math.floor((m.paneRightPct - m.startXPct) / m.cellWPct));
      videoGrid.innerHTML = '';
      videos.forEach(function(v, i){
        var col = i % cols;
        var row = Math.floor(i / cols);
        var left = m.startXPct + col * m.cellWPct;
        var top = m.startYPct + row * m.cellHPct;

        var item = document.createElement('div');
        item.className = 'explorer-icon';
        item.style.left = left + '%';
        item.style.top = top + '%';
        item.style.width = m.iconWPct + '%';
        item.setAttribute('data-index', i);

        var thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        var img = document.createElement('img');
        img.src = v.thumb;
        img.alt = v.name;
        thumbWrap.appendChild(img);

        var label = document.createElement('div');
        label.className = 'vid-label';
        label.textContent = v.name;

        item.appendChild(thumbWrap);
        item.appendChild(label);
        videoGrid.appendChild(item);

        item.addEventListener('click', function(e){
          e.stopPropagation();
          document.querySelectorAll('.explorer-icon').forEach(function(el){
            el.classList.remove('selected');
          });
          item.classList.add('selected');
        });

        item.addEventListener('dblclick', function(e){
          e.stopPropagation();
          openPlayer(i);
        });
      });
    }

    var resizeTimer = null;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderVideos, 150);
    });
 
    videoGrid.addEventListener('click', function(){
      document.querySelectorAll('.explorer-icon').forEach(function(el){
        el.classList.remove('selected');
      });
    });
 
    /* ============== PLAYER (uses player.png as the actual chrome image) ============== */
    var playerOverlay = document.getElementById('player-overlay');
    var playerWin = document.getElementById('playerWin');
    var playerTitlebar = document.getElementById('playerTitlebar');
    var playerVideo = document.getElementById('playerVideo');
    var playerClose = document.getElementById('playerClose');
 
    function openPlayer(index){
      currentVideoIndex = index;
      var v = videos[index];
      playerVideo.src = v.file;
      playerOverlay.classList.add('active');
      anthem.pause();
      playerVideo.play().catch(function(){});
    }
 
    function closePlayer(){
      playerOverlay.classList.remove('active');
      playerVideo.pause();
      playerVideo.currentTime = 0;
      playerVideo.removeAttribute('src');
      playerVideo.load();
      startAnthem();
    }
 
    playerClose.addEventListener('click', closePlayer);
 
    /* ---- make the player window draggable by its titlebar/menu strip ---- */
    (function makeDraggable(){
      var dragging = false;
      var offsetX = 0, offsetY = 0;
 
      function startDrag(clientX, clientY){
        var rect = playerWin.getBoundingClientRect();
        playerWin.style.left = rect.left + 'px';
        playerWin.style.top = rect.top + 'px';
        playerWin.style.transform = 'none';
        offsetX = clientX - rect.left;
        offsetY = clientY - rect.top;
        dragging = true;
      }
      function moveDrag(clientX, clientY){
        if(!dragging) return;
        var x = clientX - offsetX;
        var y = clientY - offsetY;
        var maxX = window.innerWidth - playerWin.offsetWidth;
        var maxY = window.innerHeight - playerWin.offsetHeight;
        x = Math.max(0, Math.min(x, maxX));
        y = Math.max(0, Math.min(y, maxY));
        playerWin.style.left = x + 'px';
        playerWin.style.top = y + 'px';
      }
      function endDrag(){
        dragging = false;
      }
 
      playerTitlebar.addEventListener('mousedown', function(e){
        startDrag(e.clientX, e.clientY);
        e.preventDefault();
      });
      document.addEventListener('mousemove', function(e){
        moveDrag(e.clientX, e.clientY);
      });
      document.addEventListener('mouseup', endDrag);
 
      playerTitlebar.addEventListener('touchstart', function(e){
        var t = e.touches[0];
        startDrag(t.clientX, t.clientY);
      }, {passive:true});
      document.addEventListener('touchmove', function(e){
        if(!dragging) return;
        var t = e.touches[0];
        moveDrag(t.clientX, t.clientY);
      }, {passive:true});
      document.addEventListener('touchend', endDrag);
    })();
 
    renderVideos();
  </script>
 
</body>
</html>
